  <style>
    #tabPhoto {
      mix-blend-mode: multiply;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-group input.error {
      border-color: red;
    }

    .form-group .error-message {
      color: red;
      font-size: 0.875em;
      display: none;
    }

    .form-group .error-message.active {
      display: block;
    }

    .form-group .success-message {
      color: green;
      font-size: 0.875em;
      display: none;
    }

    .form-group .success-message.active {
      display: block;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
    }

    .social-message {
      display: flex;
      align-items: center;
      padding-top: 1rem;
    }

    .line {
      height: 1px;
      flex: 1 1 0%;
      background-color: rgba(55, 65, 81, 1);
    }

    .social-message .message {
      padding-left: 0.75rem;
      padding-right: 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      color: rgba(156, 163, 175, 1);
    }

    .social-icons {
      display: flex;
      justify-content: center;
    }

    .social-icons .icon {
      border-radius: 0.125rem;
      padding: 0.75rem;
      border: none;
      background-color: transparent;
      margin-left: 8px;
    }

    .social-icons .icon svg {
      height: 1.25rem;
      width: 1.25rem;
      fill: #fff;
    }

    .signup {
      text-align: center;
      font-size: 0.75rem;
      line-height: 1rem;
      color: rgba(156, 163, 175, 1);
    }
  </style>
</head>

<body>
  <div class="container" style="background-image: linear-gradient(163deg, #00ff75 0%, #3700ff 100%);
    border-radius: 22px;" style="width: 300px;">
    <h1 style="color: #f5f5f5;">Sign Up</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username" style="color: #f5f5f5;">Username</label>
        <input type="text" id="username" name="username" />
        <div class="error-message" id="usernameError">Username is required</div>
      </div>
      <div class="form-group">
        <label for="password" style="color: #f5f5f5;">Password</label>
        <input type="password" id="password" name="password" />
        <div class="error-message" id="passwordError">Password is required</div>
      </div>
      <div>
        <input type="checkbox" onclick="passShow()"><span style="color: #f5f5f5;">Show Password</span>
      </div>
      <div style="margin-bottom: 20px;margin-left: 260px;">
        <a class="forgot" rel="noopener noreferrer" href="#">Forgot Password ?</a>
      </div>
      <div class="form-group">
        <button type="submit"> <a href="Website.html" style="text-decoration: none;">SignUp</a></button>
      </div>
    </form>
    <div class="social-message" style="width: 400px;">
      <div class="line"></div>
      <p class="message">Login with social accounts</p>
      <div class="line"></div>
    </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      // Prevent form submission
      event.preventDefault();

      // Get form elements
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const usernameError = document.getElementById('usernameError');
      const passwordError = document.getElementById('passwordError');

      // Clear previous error messages
      usernameError.classList.remove('active');
      passwordError.classList.remove('active');
      username.classList.remove('error');
      password.classList.remove('error');

      let isValid = true;

      // Validate username
      if (username.value.trim() === '') {
        usernameError.classList.add('active');
        username.classList.add('error');
        isValid = false;
      }

      // Validate password
      if (password.value.trim() === '') {
        passwordError.classList.add('active');
        password.classList.add('error');
        isValid = false;
      }

      if (isValid) {
        alert('Form submitted successfully!');
      }
    });


    //password show
    function passShow() {
      var passwordShow = document.getElementById("password");
      if (passwordShow.type === "password") {
        passwordShow.type = "text";
      } else {
        passwordShow.type = "password";
      }
    }
  </script>
